# Wavelength calibration shifts, in Angstroms.
#
# Additive offset applied to the spectrograph wavelength array to align the
# neutral lines (Fe II 1392.149, S I 1392.588, Fe II 1392.817 vacuum) with
# their nominal positions:
#
#     sg_wavelength_aligned = sg_wavelength_full + shift
#
# Determined per mosaic by notebooks/wavelength_calibration.ipynb. Add a new
# entry whenever that notebook is run on a new mosaic.
#
# Read with iris_mosaics.wavelength_shift('20240811') -> Quantity in Angstrom.

units: Angstrom

shifts:
  "20190912": 0.011
  "20140324": 0.015
  "20240811": -0.018
