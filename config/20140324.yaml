# Configuration for the 20140324 IRIS full-disk mosaic.
# Values that used to be edited by hand into notebook cells.

date: "20140324"

# JSOC export window (mosaic start/end plus a 2-minute margin).
jsoc:
  start: "2014-03-24 03:18:00"
  end: "2014-03-25 03:25:00"

# Local archive root. Every processing level lives under here.
data_root: "D:/IRIS data/deep_mosaics/20140324"

raster:
  num_img_per_raster: 64
  step_arcsec: 2

# 2 means the spectral axis has twice the usual pixels and needs rebinning
# before radiometric calibration.
spectral_binning: 1

# Additive offset aligning the neutral lines, from wavelength_calibration.ipynb.
# null until that notebook has been run for this mosaic.
wavelength_shift_angstrom: 0.015

# Occulting geometry for fixed-pattern removal (off-disk pixel selection).
# limb_radius_arcsec null means: read RSUN_OBS from the FITS header and add
# 10 arcsec. The centre offsets recentre the mask on the actual solar disk.
off_disk:
  limb_radius_arcsec: 970
  margin_arcsec: 60
  center_offset_x_arcsec: 0
  center_offset_y_arcsec: 5

notes: "5-second step cadence instead of 9-second."
